name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The release job creates the GitHub Release and attaches the archives to it, which
# needs more than the read-only token some repositories grant by default.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt refuses to open a real window without a display. offscreen gives the widgets a
  # backing store and lets the whole suite run headless on both runners.
  QT_QPA_PLATFORM: offscreen
  # Qt's own logging goes to stderr and is noisy enough to hide pytest output.
  QT_LOGGING_RULES: "qt.qpa.*=false"
  PYTHONWARNINGS: ignore

jobs:
  # -----------------------------------------------------------------------------
  # install.sh must work when piped, so CI exercises it exactly the way a user would:
  # `curl … | sh`. The dry-run flags are safe on a CI runner; a real install into
  # $RUNNER_TEMP proves the download/unpack/symlink path without touching $HOME.
  # -----------------------------------------------------------------------------
  installer:
    name: install.sh (posix shells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install POSIX shells for the syntax matrix
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dash ksh

      - name: Syntax check under every POSIX-ish shell
        run: |
          for shell in sh dash bash ksh; do
            echo "--- $shell -n install.sh"
            "$shell" -n install.sh
          done

      - name: Self-documenting flags
        run: |
          set -eu
          sh install.sh --help    > /dev/null
          sh install.sh --version > /dev/null
          sh install.sh --dry-run
          # --uninstall on a clean machine must succeed, not fail.
          sh install.sh --uninstall

      - name: Piped invocation must not read stdin
        run: |
          set -eu
          # If the script read stdin it would swallow its own remaining text here and
          # die with a parse error partway through.
          curl -fsSL "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/${GITHUB_SHA}/install.sh" \
            | sh -s -- --dry-run

      - name: Real install from source into a temp prefix
        run: |
          set -eu
          prefix="${RUNNER_TEMP}/binaural-ci"
          sh install.sh \
            --source \
            --prefix="$prefix" \
            --bin-dir="$prefix/bin" \
            --no-path-edit \
            --no-verify
          test -x "$prefix/bin/binaural"
          # The fallback must not leave anything in $HOME.
          test ! -e "$HOME/.binaural"
          "$prefix/bin/binaural" --version || echo "(--version is not handled by the app yet)"
          sh install.sh --uninstall --prefix="$prefix" --bin-dir="$prefix/bin" --no-path-edit
          test ! -e "$prefix"

      - name: shellcheck (advisory)
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --shell=sh --severity=warning install.sh scripts/*.sh || true

  # -----------------------------------------------------------------------------
  # The version, in every file that states it, before anything else runs.
  #
  # A release tagged v0.3.0 while `MARKETING_VERSION` still said 0.2.2 builds an app
  # that calls itself 0.2.2 and ships an updater that asks GitHub for an archive nobody
  # published. Nothing fails: the build works, the release publishes, and *Check for
  # updates* says "you are up to date" forever. The same check runs inside pytest, so a
  # red run here means a red run there too; it is first because it is the one that can be
  # fixed in ten seconds and means nothing is publishable.
  # -----------------------------------------------------------------------------
  version:
    name: release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `scripts/check_version.py` compares the tag with the files, so the tag object
          # has to be in the clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One version, everywhere
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python3 scripts/check_version.py --tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/check_version.py
          fi

  # -----------------------------------------------------------------------------
  # The macOS product's own tests.
  #
  # There were none. The Swift suite — 182 window and layout tests — ran only on the
  # machine that wrote it, while CI built and published the app it verifies. Every bug
  # fixed in this repository over the last few months (a scroll view whose document view
  # put its first row off the top of the window, buttons built with an empty title, a
  # dialog whose controller was garbage collected the moment it was shown) passed the
  # whole Python matrix, because the Python matrix does not build a line of Swift.
  #
  # Separate from `test` rather than added to it: the two products share a repository and
  # a contract, not a toolchain, and a Qt-only failure must not be able to stop a Swift
  # release (or the other way round).
  # -----------------------------------------------------------------------------
  test-macos:
    name: xcodebuild on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the project
        # The .xcodeproj is a build product: project.yml is the source, and generating it
        # here means the checked-in file can never drift from it.
        run: |
          set -eu
          brew install xcodegen
          cd apple && xcodegen generate
      - name: Core
        run: |
          set -eu
          cd apple
          xcodebuild -project Binaural.xcodeproj -scheme BinauralCore \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: App
        run: |
          set -eu
          cd apple
          xcodebuild -project Binaural.xcodeproj -scheme Binaural \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

  # -----------------------------------------------------------------------------
  # The real test matrix (CONTRACT §7: `.venv/bin/python -m pytest` must stay green).
  # -----------------------------------------------------------------------------
  test:
    name: pytest ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Qt's xcb platform plugin dlopen()s these at import time. Without them the tests
      # fail with "could not load the Qt platform plugin xcb".
      #
      # libpulse0 is the odd one out and is not about the platform plugin: Qt's audio
      # backend is PulseAudio, and libQt6Multimedia.so.6 links libpulse.so.0 directly,
      # so the dynamic loader needs the library present the moment
      # `import PySide6.QtMultimedia` runs. Without it the import dies with
      #   ImportError: libpulse.so.0: cannot open shared object file
      # while every other test still passes, because src/binaural/core/engine.py
      # imports QtMultimedia in a try/except and reports it at runtime instead.
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon0 \
            libfontconfig1 \
            libfreetype6 \
            libpulse0

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest

      - name: Tests, explicit -q and no cache
        if: always()
        run: python -m pytest --cache-clear

      # The audio backend is a Qt plugin loaded through dlopen; a packaging mistake would
      # otherwise only show up on a user's machine as "no audio output".
      - name: QtMultimedia is importable
        run: |
          python - <<'PY'
          from PySide6.QtMultimedia import QAudioSink, QMediaDevices  # noqa: F401
          print("QtMultimedia backend is present")
          PY

  # -----------------------------------------------------------------------------
  # Build artifact. Manual only: a release needs both Linux platforms, and PyInstaller
  # cannot cross-compile, so each target runs on a runner of its own.
  #
  # macOS is not in this matrix: the macOS product is the native app in apple/, which
  # apple/build_release.sh builds on a Mac. There is no Python bundle for macOS.
  # -----------------------------------------------------------------------------
  build-release:
    name: pyinstaller ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch'
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            arch: x64
          # No public arm64 Linux runner: build this one on a self-hosted x64 box with
          # docker buildx + QEMU, or add a native arm64 runner.
          - target: linux-arm64
            os: ubuntu-latest
            arch: arm64
            continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libpulse0 for the same reason as in the test job: libQt6Multimedia.so.6 links
      # libpulse.so.0, and scripts/build_linux.sh refuses to build when
      # `import PySide6.QtMultimedia` fails.
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libpulse0

      - name: Install the project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Build
        run: sh scripts/make_release.sh --target ${{ matrix.target }}

      - name: Sanity-check the archive
        run: |
          set -eu
          ls -la dist/
          test -f dist/SHA256SUMS
          # The archive must contain a runnable entry point plus the frequency data.
          tar -tzf dist/*.tar.gz | head -40
          tar -tzf dist/*.tar.gz | grep -q 'binaural/data/frequencies.json'

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaural-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  # -----------------------------------------------------------------------------
  # Release builds. Tag pushes only: a full build on every push would burn runner
  # minutes for an artifact nobody consumes, and a release is a deliberate act.
  #
  # Two jobs, not one matrix, because they are two products that gate on two different
  # test suites. They used to share a single job behind `needs: [test]`, which meant a
  # crash in the Qt test suite on Python 3.10 stopped the native macOS app being
  # published — and it had been stopping it, silently, since v0.2.1. The Python suite is
  # the right gate for the PyInstaller archive; the Swift suite is the right gate for
  # the .app. Neither has any business gating the other.
  #
  # Both name their archive `binaural-<version>-<target>.tar.gz`; the macOS one is what
  # the in-app updater asks GitHub for, and `scripts/check_version.py` (the `version` job,
  # and pytest) checks that the name the build writes is still the name the updater reads.
  # -----------------------------------------------------------------------------
  release-macos:
    name: release (macos-arm64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, test-macos]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CI has no Apple Developer identity, so the app is built unsigned, exactly as it
      # is on a Mac.
      - name: Build the app
        run: |
          set -eu
          brew install xcodegen
          sh scripts/build_macos.sh
          ls -la dist/

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: binaural-macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release-linux:
    name: release (linux-x64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libpulse0 for the same reason as in the test job: libQt6Multimedia.so.6 links
      # libpulse.so.0, and scripts/build_linux.sh refuses to build when
      # `import PySide6.QtMultimedia` fails.
      - name: Qt runtime libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon0 \
            libfontconfig1 \
            libfreetype6 \
            libpulse0

      - name: Install the project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Build the archive
        run: |
          set -eu
          sh scripts/build_linux.sh
          ls -la dist/

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: binaural-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # -----------------------------------------------------------------------------
  # One release, two archives: the matrix above builds them, this job attaches them
  # to the GitHub Release for the tag. softprops/action-gh-release creates the
  # release when it does not exist yet and adds the files as assets when it does.
  # -----------------------------------------------------------------------------
  publish-release:
    name: publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-macos, release-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download the built archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  # -----------------------------------------------------------------------------
  # The installer is POSIX sh, so it must keep parsing on a strict shell too.
  # -----------------------------------------------------------------------------
  strict-posix:
    name: install.sh under dash and ksh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dash and ksh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dash ksh

      - name: Parse and run under dash
        run: |
          dash -n install.sh
          dash install.sh --version
          dash install.sh --dry-run
          dash install.sh --uninstall

      - name: Parse and run under ksh
        run: |
          ksh -n install.sh
          ksh install.sh --version
          ksh install.sh --dry-run
          ksh install.sh --uninstall
