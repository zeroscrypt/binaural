[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binaural"
version = "0.2.0"
description = "Binaural beat generator for macOS and Linux — two independent frequencies, one perceived difference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitriy Solontsov" }]
keywords = ["binaural", "beats", "brainwave", "entrainment", "audio", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]

dependencies = [
    "PySide6-Essentials>=6.5",
    "PySide6-Addons>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/zeroscrypt/binaural"
Issues = "https://github.com/zeroscrypt/binaural/issues"

[project.scripts]
binaural = "binaural.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binaural = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
